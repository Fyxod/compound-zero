[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "compound-zero"
version = "0.1.0"
description = "Reproducible compound-risk benchmark and FastAPI service for Compound Zero."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.6,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[project.scripts]
compound-zero-train = "ml.train:main"
compound-zero-api = "services.api.run:main"

[tool.setuptools.packages.find]
include = ["ml*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["."]
addopts = "-ra"

