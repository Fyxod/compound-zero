---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run backend suite
        run: python -m pytest -q

      - name: Reproduce full ScenarioBench artifacts in an isolated directory
        run: |
          python -m ml.train \
            --data-dir "$RUNNER_TEMP/scenario_bench" \
            --artifact-dir "$RUNNER_TEMP/artifacts" \
            > "$RUNNER_TEMP/training-summary.json"

      - name: Verify reproduced dataset and artifact contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          checked = json.loads(Path("data/scenario_bench/metadata.json").read_text())
          generated = json.loads((runner_temp / "scenario_bench" / "metadata.json").read_text())
          metrics = json.loads((runner_temp / "artifacts" / "metrics.json").read_text())
          model = runner_temp / "artifacts" / "compound_zero_model.joblib"

          assert generated["classification"] == "SIMULATED"
          assert generated["sha256"] == checked["sha256"]
          assert metrics["split"]["overlap_count"] == 0
          assert metrics["dataset"]["sha256"] == generated["sha256"]
          assert model.stat().st_size > 100_000
          print(f"ScenarioBench SHA-256 verified: {generated['sha256']}")
          PY

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install lockfile dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build production assets
        env:
          VITE_API_BASE_URL: /api
        run: pnpm build

  containers:
    name: Container build and integration smoke
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_PORT: "8000"
      WEB_PORT: "4173"
      VITE_API_BASE_URL: /api
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Validate Compose expansion
        run: docker compose config --quiet

      - name: Build and start hardened stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Smoke-test API, web and same-origin proxy
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['ready'] is True and d['llm_in_risk_path'] is False"
          curl --fail --silent --show-error http://127.0.0.1:4173/healthz
          curl --fail --silent --show-error http://127.0.0.1:4173/api/health \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['ready'] is True"
          curl --fail --silent --show-error http://127.0.0.1:4173/ \
            | grep --quiet "Compound Zero"

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
