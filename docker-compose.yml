---
name: ${COMPOSE_PROJECT_NAME:-compound-zero}

services:
  api:
    image: compound-zero-api:local
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    init: true
    ports:
      - "${API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)); assert d['ready'] is True"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  web:
    image: compound-zero-web:local
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4173}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
